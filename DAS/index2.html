<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutritional Info Comparison</title>
    <!-- Importing Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Lato:wght@300;400;700&family=Montserrat:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-text: #2c3e50;
            --light-text: #a0a0a0;
            --brand-color-1: #e67e6d;
            /* Salmon color for left side */
            --brand-color-2: #383838;
            /* Dark color for right side */
            --border-color: #d1d1d1;
            --bg-color: #ffffff;
            --btn-color: #2b303d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            min-height: 100vh;
        }

        /* Main Heading */
        .main-title {
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin-bottom: 60px;
            color: var(--brand-color-2);
        }

        .main-title span {
            font-weight: 300;
            color: var(--light-text);
        }

        /* Card Container */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 60px 0 40px 0;
            /* Space for pills */
            display: grid;
            grid-template-columns: 1fr 180px 1fr;
            margin-bottom: 40px;
        }

        /* Vertical Dividers */
        .col-left {
            border-right: 1px solid var(--border-color);
        }

        .col-right {
            border-left: 1px solid var(--border-color);
        }

        /* Columns */
        .col {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Header Pills (Absolute positioning to sit on border) */
        .brand-pill {
            position: absolute;
            top: -95px;
            /* Adjust based on container padding/position */
            background: white;
            padding: 10px 30px;
            border-radius: 40px;
            text-align: center;
            min-width: 160px;
            z-index: 10;
        }

        .pill-left {
            left: 50%;
            transform: translateX(-50%);
            border: 1px dashed #bba3a3;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #4a1919;
        }

        .pill-right {
            left: 50%;
            transform: translateX(-50%);
            border: 1px dotted #888;
            font-family: 'Playfair Display', serif;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8px 20px;
        }

        .pill-right strong {
            font-size: 1.2rem;
            line-height: 1;
        }

        .pill-right span {
            font-size: 0.6rem;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Horizontal Divider within columns */
        .h-divider {
            width: 100%;
            height: 1px;
            background-color: var(--border-color);
            margin: 20px 0;
        }

        /* Typography Styling */
        .big-number {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 5px;
        }

        .sub-label {
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: var(--light-text);
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 400;
            margin: 10px 0;
            font-family: 'Lato', sans-serif;
        }

        /* Colors specific to sides */
        .col-left .big-number,
        .col-left .stat-val {
            color: var(--brand-color-1);
        }

        .col-right .big-number,
        .col-right .stat-val {
            color: var(--brand-color-2);
        }

        /* Middle Column / Labels */
        .col-mid {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Image Placeholders - REPLACE SRC WITH YOUR IMAGES */
        .truffle-img-top {
            width: 220px;
            height: auto;
            position: absolute;
            top: -150px;
            /* Pull image up */
            z-index: 10;
        }

        .truffle-img-mid {
            width: 180px;
            height: auto;
            position: relative;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .mid-label {
            color: #777;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .nutrient-list {
            margin-top: 15px;
            width: 100%;
            text-align: center;
        }

        .nutrient-item {
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 19px 0;
            /* Align with side numbers */
            font-weight: 600;
        }

        /* Bottom Disclaimer Pill */
        .disclaimer-pill {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 1px dotted #999;
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 0.65rem;
            color: #777;
            white-space: nowrap;
            width: 80%;
            text-align: center;
        }

        /* CTA Button */
        .cta-btn {
            background-color: var(--btn-color);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
        }

        /* Section spacing helpers */
        .section-top {
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .section-btm {
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .card-container {
                grid-template-columns: 1fr;
                border-radius: 20px;
                padding-top: 100px;
            }

            .col-left,
            .col-right {
                border: none;
                padding-bottom: 20px;
                border-bottom: 1px solid #eee;
            }

            .col-mid {
                display: none;
                /* Layout breaks on mobile, simplistic hide for this demo or needs total restructure */
            }

            /* Ideally for mobile you stack them differently, but for exact replication of desktop UI, we keep grid above */
        }
    </style>
</head>

<body>

    <h1 class="main-title">NUTRITIONAL <span>INFO</span></h1>

    <div class="card-container">

        <!-- Left Column (DAS) -->
        <div class="col col-left">
            <div class="brand-pill pill-left">DAS</div>

            <div class="section-top">
                <div class="big-number">40</div>
                <div class="sub-label">CALORIES</div>
            </div>

            <div class="h-divider"></div>

            <div class="section-btm">
                <div class="big-number">120</div>
                <div class="sub-label">CALORIES</div>

                <div style="margin-top: 40px;"> <!-- Spacer for nutrient list alignment -->
                    <div class="stat-val">9</div>
                    <div class="stat-val">5</div>
                    <div class="stat-val">9</div>
                </div>
            </div>
        </div>

        <!-- Middle Column (Labels & Images) -->
        <div class="col col-mid">
            <!-- Top Image (Single Truffle) -->
            <!-- Note: Using placeholder. Replace src with actual transparent PNG of single truffle -->
            <img src="assets/images/truffle-removebg-preview.png" alt="Single Truffle" class="truffle-img-top">

            <div class="section-top">
                <div class="mid-label">Per truffle(12g)</div>
            </div>

            <!-- Middle Image (Five Truffles) - Purely visual spacing here mostly -->
            <!-- Note: Using placeholder. Replace src with actual transparent PNG of 3 truffles -->
            <img src="assets/images/5.png" alt="Five Truffles" class="truffle-img-mid">

            <div class="mid-label">Per Serving(60g)</div>

            <div class="nutrient-list">
                <div class="nutrient-item">TOTAL FAT</div>
                <div class="nutrient-item">SATURATED FAT</div>
                <div class="nutrient-item">TOTAL SUGAR</div>
            </div>
        </div>

        <!-- Right Column (Lindt) -->
        <div class="col col-right">
            <div class="brand-pill pill-right">
                <strong>Lindt lindor</strong>
                <span>Dark Chocolate Truffle</span>
            </div>

            <div class="section-top">
                <div class="big-number">77</div>
                <div class="sub-label">CALORIES</div>
            </div>

            <div class="h-divider"></div>

            <div class="section-btm">
                <div class="big-number">230</div>
                <div class="sub-label">CALORIES</div>

                <div style="margin-top: 40px;"> <!-- Spacer for nutrient list alignment -->
                    <div class="stat-val">19</div>
                    <div class="stat-val">15</div>
                    <div class="stat-val">13</div>
                </div>
            </div>
        </div>

        <!-- Disclaimer Overlay -->
        <div class="disclaimer-pill">
            *Calculated by dividing declared per serving value by Five
        </div>

    </div>

    <button class="cta-btn">NUTRITIONAL FACTS & INGREDIENTS</button>

</body>

</html>
